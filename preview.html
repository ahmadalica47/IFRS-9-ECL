d.t + (H - pad.t - pad.b) * (max - v) / (max - min || 1);\n    const ticks = [0, 0.25, 0.5, 0.75, 1].map(t => min + t * (max - min));\n    return <div className=\"ch\" ref={ref} onMouseLeave={() => setTip(null)}>\n        <svg viewBox={`0 0 ${W} ${H}`} className=\"ch-svg\" role=\"img\" aria-label={series.map(s => s.name).join(', ')}>\n            {ticks.map((t, i) => <g key={i}><line x1={pad.l} x2={W - pad.r} y1={y(t)} y2={y(t)} className=\"grid\" /><text x={pad.l - 6} y={y(t) + 3} textAnchor=\"end\" className=\"ax\">{short(t)}<\/text><\/g>)}\n            {labels.map((lb, i) => {\n                const dim = selected && selected !== lb;\n                return <g key={lb + i} className={onSelect ? 'clk' : ''} opacity={dim ? 0.35 : 1}\n                    onClick={() => onSelect?.(lb)}\n                    onMouseMove={e => setTip({ ...rel(e, ref.current), html: <><b>{lb}<\/b>{series.map((s, j) => <div key={j}><i style={{ background: perBar && series.length === 1 ? perBar[i % perBar.length] : cs[j % cs.length] }} />{s.name}: {fmtV(s.values[i])}<\/div>)}{tipExtra?.(i)}{onSelect && <div className=\"tip-h\">Click to filter<\/div>}<\/> })}>\n                    <rect x={pad.l + i * bw} y={pad.t} width={bw} height={H - pad.t - pad.b} fill=\"transparent\" />\n                    {series.map((s, j) => { const v = s.values[i]; const x = pad.l + i * bw + bw * 0.15 + j * gw; const y0 = y(Math.max(0, v)), y1 = y(Math.min(0, v));\n                        return <rect key={j} x={x} y={y0} width={Math.max(1, gw - 3)} height={Math.max(0, y1 - y0)} rx=\"3\" fill={perBar && series.length === 1 ? perBar[i % perBar.length] : cs[j % cs.length]} />; })}\n                    {(() => { const t = lb.replace(/ days$/, 'd').replace(/^Over (\\d+)d$/, '>$1d'); const mx = Math.max(4, Math.floor(bw / 6.5)); const words = t.length > mx && t.includes(' ') ? [t.slice(0, t.lastIndexOf(' ', mx) > 0 ? t.lastIndexOf(' ', mx) : mx), t.slice((t.lastIndexOf(' ', mx) > 0 ? t.lastIndexOf(' ', mx) : mx)).trim()] : [t];\n                        return words.slice(0, 2).map((w, k) => <text key={k} x={pad.l + i * bw + bw / 2} y={H - pad.b + 14 + k * 12} textAnchor=\"middle\" className=\"ax\">{w.length > mx ? w.slice(0, mx - 1) + '\u2026' : w}<\/text>); })()}\n                <\/g>;\n            })}\n        <\/svg>\n        {series.length > 1 && <div className=\"lg\">{series.map((s, j) => <span key={s.name}><i style={{ background: cs[j % cs.length] }} />{s.name}<\/span>)}<\/div>}\n        <TipBox tip={tip} />\n    <\/div>;\n}\n\n// Horizontal ranking bars. Click a row to select it.\nexport function HBars({ items, fmtV = fmt, onSelect, selected, color = C.indigo }: { items: { label: string; value: number; sub?: string; color?: string }[]; fmtV?: (n: number) => string; onSelect?: (l: string) => void; selected?: string | null; color?: string }) {\n    const max = Math.max(1, ...items.map(i => Math.abs(i.value)));\n    return <div className=\"hb\">{items.map(i => <button type=\"button\" key={i.label} className={'hbr' + (selected === i.label ? ' on' : '') + (selected && selected !== i.label ? ' dim' : '')} onClick={() => onSelect?.(i.label)} disabled={!onSelect}>\n        <div className=\"hbl\"><span>{i.label}<\/span><b>{fmtV(i.value)}<\/b><\/div>\n        <div className=\"hbt\"><i style={{ width: (Math.abs(i.value) / max) * 100 + '%', background: i.color || color }} /><\/div>\n        {i.sub && <small>{i.sub}<\/small>}<\/button>)}<\/div>;\n}\n\n// Donut with hover and click.\nexport function Donut({ parts, center, centerSub, onSelect, selected, size = 150 }: { parts: { label: string; value: number; color: string }[]; center: string; centerSub?: string; onSelect?: (l: string) => void; selected?: string | null; size?: number }) {\n    const [hov, setHov] = useState<string | null>(null);\n    const total = parts.reduce((a, p) => a + Math.max(0, p.value), 0);\n    const R = 60, r = 40, cx = 70, cy = 70; let a0 = -Math.PI / 2;\n    const arcs = parts.filter(p => p.value > 0).map(p => {\n        const frac = p.value / Math.max(total, 1); const a1 = a0 + frac * Math.PI * 2 * 0.99999; const large = a1 - a0 > Math.PI ? 1 : 0;\n        const pt = (a: number, rad: number) => `${cx + rad * Math.cos(a)} ${cy + rad * Math.sin(a)}`;\n        const d = `M ${pt(a0, R)} A ${R} ${R} 0 ${large} 1 ${pt(a1, R)} L ${pt(a1, r)} A ${r} ${r} 0 ${large} 0 ${pt(a0, r)} Z`; a0 = a1; return { ...p, d, frac };\n    });\n    const h = arcs.find(a => a.label === hov);\n    return <div className=\"dn\">\n        <svg viewBox=\"0 0 140 140\" style={{ width: size, height: size }} role=\"img\" aria-label=\"Share chart\">\n            {arcs.map(p => <path key={p.label} d={p.d} fill={p.color} className={onSelect ? 'clk' : ''} opacity={(selected && selected !== p.label) || (hov && hov !== p.label) ? 0.35 : 1}\n                onMouseEnter={() => setHov(p.label)} onMouseLeave={() => setHov(null)} onClick={() => onSelect?.(p.label)} />)}\n            <text x=\"70\" y=\"68\" textAnchor=\"middle\" className=\"dn-c\">{h ? pct(h.frac, 0) : center}<\/text>\n            <text x=\"70\" y=\"84\" textAnchor=\"middle\" className=\"dn-s\">{h ? (h.label.length > 16 ? h.label.slice(0, 15) + '\u2026' : h.label) : centerSub}<\/text>\n        <\/svg>\n        <div className=\"lg col\">{parts.map(p => <button type=\"button\" key={p.label} className={'lg-b' + (selected === p.label ? ' on' : '')} onClick={() => onSelect?.(p.label)} disabled={!onSelect} onMouseEnter={() => setHov(p.label)} onMouseLeave={() => setHov(null)}>\n            <i style={{ background: p.color }} />{p.label}<b>{total ? pct(Math.max(0, p.value) / total, 0) : '0%'}<\/b><span className=\"mut\">{short(p.value)}<\/span><\/button>)}<\/div>\n    <\/div>;\n}\n\n// Waterfall: opening -> movements -> closing\nexport function Waterfall({ steps, height = 240 }: { steps: { label: string; value: number; total?: boolean }[]; height?: number }) {\n    const { tip, setTip } = useTip(); const ref = React.useRef<HTMLDivElement>(null);\n    let run = 0; const bars = steps.map(s => { if (s.total) { run = s.value; return { ...s, a: 0, b: s.value }; } const a = run; run += s.value; return { ...s, a, b: run }; });\n    const max = Math.max(1, ...bars.map(b => Math.max(b.a, b.b))); const min = Math.min(0, ...bars.map(b => Math.min(b.a, b.b)));\n    const W = Math.max(680, steps.length * 150), H = height, pad = { l: 50, r: 10, t: 16, b: 52 };\n    const bw = (W - pad.l - pad.r) / steps.length; const y = (v: number) => pad.t + (H - pad.t - pad.b) * (max - v) / (max - min || 1);\n    return <div className=\"ch\" ref={ref} onMouseLeave={() => setTip(null)}><svg viewBox={`0 0 ${W} ${H}`} className=\"ch-svg\" role=\"img\" aria-label=\"Movement waterfall\">\n        {[0, 0.5, 1].map(t => { const v = min + t * (max - min); return <g key={t}><line x1={pad.l} x2={W - pad.r} y1={y(v)} y2={y(v)} className=\"grid\" /><text x={pad.l - 6} y={y(v) + 3} textAnchor=\"end\" className=\"ax\">{short(v)}<\/text><\/g>; })}\n        {bars.map((b, i) => { const top = y(Math.max(b.a, b.b)), bot = y(Math.min(b.a, b.b)); const col = b.total ? C.indigo : b.value >= 0 ? C.red : '#10b981';\n            return <g key={i} onMouseMove={e => setTip({ ...rel(e, ref.current), html: <><b>{b.label}<\/b><div>{b.total ? fmt(b.value) : (b.value >= 0 ? '+' : '') + fmt(b.value)}<\/div><\/> })}>\n                <rect x={pad.l + i * bw + bw * 0.18} y={top} width={bw * 0.64} height={Math.max(1, bot - top)} rx=\"3\" fill={col} />\n                {i < bars.length - 1 && <line x1={pad.l + i * bw + bw * 0.82} x2={pad.l + (i + 1) * bw + bw * 0.18} y1={y(b.b)} y2={y(b.b)} stroke=\"#94a3b8\" strokeDasharray=\"3 3\" />}\n                <text x={pad.l + i * bw + bw / 2} y={H - pad.b + 14} textAnchor=\"middle\" className=\"ax\">{b.label.split(' ').slice(0, 2).join(' ')}<\/text>\n                <text x={pad.l + i * bw + bw / 2} y={H - pad.b + 26} textAnchor=\"middle\" className=\"ax\">{b.label.split(' ').slice(2, 4).join(' ')}<\/text>\n            <\/g>; })}\n    <\/svg><TipBox tip={tip} /><\/div>;\n}\n\n// Heatmap: rows x columns, colour = coverage. Click a cell to filter both.\nexport function Heatmap({ rows, cols, cell, onSelect }: { rows: string[]; cols: string[]; cell: (r: string, c: string) => { gross: number; ecl: number }; onSelect?: (r: string, c: string) => void }) {\n    const vals = rows.flatMap(r => cols.map(c => { const x = cell(r, c); return x.gross > 0 ? x.ecl / x.gross : 0; })); const max = Math.max(0.0001, ...vals);\n    const bg = (v: number) => { const t = Math.min(1, v / max); return `rgba(225, 29, 72, ${0.06 + t * 0.8})`; };\n    return <div className=\"scroll\"><table className=\"hm\"><thead><tr><th />{cols.map(c => <th key={c}>{c}<\/th>)}<\/tr><\/thead>\n        <tbody>{rows.map(r => <tr key={r}><th>{r}<\/th>{cols.map(c => { const x = cell(r, c); const v = x.gross > 0 ? x.ecl / x.gross : 0;\n            return <td key={c} style={{ background: x.gross > 0 ? bg(v) : 'transparent', color: v / max > 0.55 ? '#fff' : undefined }} className={onSelect && x.gross ? 'clk' : ''} title={`${r} / ${c}\\nOwed ${fmt(x.gross)}\\nExpected loss ${fmt(x.ecl)}`} onClick={() => x.gross && onSelect?.(r, c)}>\n                {x.gross > 0 ? pct(v, 1) : '-'}<\/td>; })}<\/tr>)}<\/tbody><\/table><\/div>;\n}\n\n// 100% stacked bar, e.g. share of gross and of ECL by stage\nexport function Stack100({ rows, colors, onSelect }: { rows: { label: string; parts: { key: string; value: number }[] }[]; colors: Record<string, string>; onSelect?: (k: string) => void }) {\n    return <div className=\"s100\">{rows.map(r => { const t = r.parts.reduce((a, p) => a + Math.max(0, p.value), 0);\n        return <div key={r.label} className=\"s100-r\"><span className=\"s100-l\">{r.label}<\/span><div className=\"s100-b\">{r.parts.filter(p => p.value > 0).map(p =>\n            <button type=\"button\" key={p.key} style={{ width: (p.value / (t || 1)) * 100 + '%', background: colors[p.key] }} title={`${p.key}: ${fmt(p.value)} (${pct(p.value / (t || 1), 1)})`} onClick={() => onSelect?.(p.key)}>{p.value / (t || 1) > 0.08 ? pct(p.value / (t || 1), 0) : ''}<\/button>)}<\/div><\/div>; })}<\/div>;\n}\n", "dash.ts": "import { Calc, Inv, Settings, calculate } from './ecl';\n\nexport type Res = ReturnType<typeof calculate>;\nexport const eclShort = (n: number) => Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : Math.abs(n) >= 1e4 ? Math.round(n / 1e3) + 'K' : Math.round(n).toLocaleString('en-US');\n\nexport function cohorts(rows: Calc[]) {\n  const m = new Map<string, { owed: number; ecl: number; n: number }>();\n  rows.forEach(r => { const k = r.invDate.slice(0, 7); const x = m.get(k) || { owed: 0, ecl: 0, n: 0 }; x.owed += r.amount; x.ecl += r.ecl; x.n++; m.set(k, x); });\n  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([k, v]) => ({ key: k, ...v }));\n}\n\n// ECL if the economy were exactly at the normal range (all scenario multipliers = 1)\nexport function econEffect(rows: Inv[], s: Settings, weighted: number) {\n  const flat = { ...s, factors: s.factors.map(f => ({ ...f, base: f.baseline, up: f.baseline, down: f.baseline })) };\n  const neutral = calculate(rows, flat).ecl;\n  return { neutral, delta: weighted - neutral, pct: neutral ? (weighted - neutral) / neutral : 0 };\n}\n\n// Extra ECL if the invoices in the band just before the default line are still unpaid 30 days from now.\n// Recalculated with the full model (band change, stage change and PD 100% where it applies), not estimated.\nexport function slideImpact(res: Res, s: Settings) {\n  const i = s.buckets.findIndex(x => s.defaultDays >= x.from && s.defaultDays <= x.to);\n  if (i < 0) return { owed: 0, extra: 0, n: 0, label: '' };\n  const label = s.buckets[i].label;\n  const rows = res.rows.filter(r => !r.isSpec && r.bucket === label && r.stage < 3);\n  if (!rows.length) return { owed: 0, extra: 0, n: 0, label };\n  const owed = rows.reduce((a, r) => a + r.amount, 0);\n  const cur = rows.reduce((a, r) => a + r.ecl, 0);\n  const later = { ...s, reportDate: new Date(Date.parse(s.reportDate + 'T00:00:00Z') + 30 * 86400000).toISOString().slice(0, 10), specific: {} };\n  const moved = calculate(rows.map(r => ({ ...r, dpdIn: r.dpdIn !== null ? r.dpdIn + 30 : null })), later).ecl;\n  return { owed, extra: moved - cur, n: rows.length, label };\n}\n\n// ---------- comparison with last period, IFRS 7.35H / 35I reconciliation ----------\nexport const STAGES = ['Stage 1', 'Stage 2', 'Stage 3', 'POCI'];\nexport type ReconLine = { label: string; v: Record<string, number> };\nexport type Recon = { allowance: ReconLine[]; gross: ReconLine[] };\nexport type Prior = { res: Res; date: string; matched: boolean;\n  drivers: { newInv: number; cleared: number; aging: number } | null; recon: Recon | null };\n\ntype Agg = { amount: number; ecl: number; stageKey: string; rank: number };\nconst rankOf = (k: string) => k === 'POCI' ? 4 : +k.slice(-1);\nfunction aggregate(rows: Calc[]) {\n  // invoice numbers can repeat (instalments, several lines); combine them by customer + number\n  const m = new Map<string, Agg>();\n  rows.forEach(r => {\n    const k = r.customer + '|' + r.invNo; const x = m.get(k);\n    if (!x) m.set(k, { amount: r.amount, ecl: r.ecl, stageKey: r.stageKey, rank: rankOf(r.stageKey) });\n    else { x.amount += r.amount; x.ecl += r.ecl; if (rankOf(r.stageKey) > x.rank) { x.rank = rankOf(r.stageKey); x.stageKey = r.stageKey; } }\n  });\n  return m;\n}\nfunction reconcile(now: Map<string, Agg>, prior: Map<string, Agg>, f: 'amount' | 'ecl'): ReconLine[] {\n  const z = () => Object.fromEntries(STAGES.map(k => [k, 0])) as Record<string, number>;\n  const open = z(), tin = z(), tout = z(), nw = z(), der = z(), rem = z(), close = z();\n  prior.forEach((p, k) => { open[p.stageKey] += p[f]; const n = now.get(k); if (!n) der[p.stageKey] -= p[f]; });\n  now.forEach((n, k) => {\n    close[n.stageKey] += n[f]; const p = prior.get(k);\n    if (!p) { nw[n.stageKey] += n[f]; return; }\n    if (p.stageKey !== n.stageKey) { tout[p.stageKey] -= p[f]; tin[n.stageKey] += p[f]; }\n    rem[n.stageKey] += n[f] - p[f];\n  });\n  const isA = f === 'ecl';\n  return [\n    { label: isA ? 'Opening loss allowance (recalculated)' : 'Opening gross carrying amount', v: open },\n    { label: 'Transfers in from other stages', v: tin },\n    { label: 'Transfers out to other stages', v: tout },\n    { label: isA ? 'New invoices / assets originated' : 'New invoices / assets originated', v: nw },\n    { label: 'Paid, settled or written off (derecognised)', v: der },\n    { label: isA ? 'Remeasurement of open items (ageing, risk, economy)' : 'Changes in balance of open items', v: rem },\n    { label: isA ? 'Closing loss allowance' : 'Closing gross carrying amount', v: close },\n  ];\n}\nexport function comparePrior(now: Res, prior: Res, date: string): Prior {\n  const withNo = (r: Res) => r.rows.filter(x => x.invNo).length / Math.max(1, r.rows.length);\n  const can = withNo(now) >= 0.8 && withNo(prior) >= 0.8;\n  if (!can) return { res: prior, date, matched: false, drivers: null, recon: null };\n  const pm = aggregate(prior.rows); const nm = aggregate(now.rows);\n  let newInv = 0, cleared = 0, aging = 0;\n  nm.forEach((n, k) => { const p = pm.get(k); if (!p) newInv += n.ecl; else aging += n.ecl - p.ecl; });\n  pm.forEach((p, k) => { if (!nm.has(k)) cleared += p.ecl; });\n  return { res: prior, date, matched: true, drivers: { newInv, cleared: -cleared, aging }, recon: { allowance: reconcile(nm, pm, 'ecl'), gross: reconcile(nm, pm, 'amount') } };\n}\n\nexport type Action = { title: string; why: string; amount?: string };\nexport function actions(res: Res, s: Settings, f: (n: number) => string, slide: ReturnType<typeof slideImpact>, econ: ReturnType<typeof econEffect>): Action[] {\n  const out: Action[] = [];\n  const noun = s.method === 'general' ? 'exposures' : 'invoices';\n  const overD = res.rows.filter(r => r.dpd > s.defaultDays && !r.impaired);\n  const oD = overD.reduce((a, r) => a + r.amount, 0);\n  const top = res.byCust.filter(c => c.ecl > 0).slice(0, 3);\n  if (top.length) out.push({ title: `Chase ${top.map(c => c.key).join(', ')} first`, why: `${top.length === 1 ? 'This customer carries' : 'These ' + top.length + ' carry'} ${Math.round(100 * top.reduce((a, c) => a + c.ecl, 0) / Math.max(res.ecl, 1))}% of the expected loss. Every payment they make lowers your allowance.`, amount: f(top.reduce((a, c) => a + c.ecl, 0)) + ' expected loss' });\n  if (oD > 0) out.push({ title: `Agree a payment plan or escalate ${noun} over ${s.defaultDays} days`, why: `${overD.length} ${noun} are more than ${s.defaultDays} days past due. IFRS 9 presumes default at this point (B5.5.37) and they sit in Stage 3. Check whether any should be flagged credit-impaired or written off (5.4.4).`, amount: f(oD) + ' owed' });\n  if (slide.owed > 0 && slide.extra > 0) out.push({ title: `Collect the ${slide.label} ${noun} this month`, why: `${slide.n} ${noun} are close to the ${s.defaultDays}-day default line. If they are still unpaid in 30 days, your allowance rises by about ${f(slide.extra)} (recalculated, not estimated).`, amount: f(slide.owed) + ' owed' });\n  const imp = res.rows.filter(r => r.impaired && !r.isSpec);\n  if (imp.length) out.push({ title: 'Decide on defaulted customers: recover, restructure or write off', why: `${imp.length} ${noun} are flagged credit-impaired. They are provided at a 100% chance of not paying, times the share lost (LGD), on the amount not covered by collateral.`, amount: f(imp.reduce((a, r) => a + r.amount, 0)) + ' owed' });\n  const big = res.byCust.slice().sort((a, b) => b.gross - a.gross)[0];\n  if (big && res.gross && big.gross / res.gross > 0.15) out.push({ title: `Review the credit limit for ${big.key}`, why: `One customer is ${Math.round(100 * big.gross / res.gross)}% of everything you are owed. A single default would hurt. IFRS 7.34(c) asks you to disclose concentrations of risk.`, amount: f(big.gross) + ' owed' });\n  if (econ.pct > 0.1) out.push({ title: 'Watch the economy: it is adding to your allowance', why: `Economic conditions raise the expected loss by about ${Math.round(econ.pct * 100)}% compared with a normal year (${f(econ.delta)}). Re-check each quarter.`, amount: '+' + f(econ.delta) });\n  const unins = res.rows.filter(r => r.dpd > 60 && r.collateral === 0).reduce((a, r) => a + r.amount, 0);\n  if (unins > 0 && res.gross && unins / res.gross > 0.1) out.push({ title: 'Ask for guarantees or credit insurance on risky accounts', why: 'Late items with no collateral or insurance carry the full loss. Cover reduces the allowance (B5.5.55).', amount: f(unins) + ' unprotected and late' });\n  out.push({ title: 'Replace the example loss rates with your own history', why: 'The default rates are examples. Use how much you really lost in past years for each lateness group, adjusted for current and forecast conditions (B5.5.35, B5.5.52), before you rely on the number.' });\n  return out.slice(0, 6);\n}\n", "Dashboard.tsx": "import React, { useMemo, useState } from 'react';\nimport { Calc, Inv, Settings, calculate } from './ecl';\nimport { Prior, ReconLine, Res, STAGES, actions, cohorts, econEffect, slideImpact } from './dash';\nimport { Method } from './Method';\nimport { Bars, C, Donut, HBars, Heatmap, RISK, Stack100, Waterfall } from './charts';\nimport { Btn, Card, Col, DataTable, Drawer, Info, Kpi, Note, STAGE_COLOR, STAGE_TEXT, Slider, Tabs, acct, fmt, pct, short } from './ui';\n\ntype TabKey = 'overview' | 'stages' | 'ageing' | 'customers' | 'scenarios' | 'movement' | 'accounting' | 'method';\ntype Filter = { stage: string | null; bucket: string | null; seg: string | null };\ntype Agg = { key: string; n: number; gross: number; ecl: number; rows: Calc[] };\n\nconst sum = (rows: Calc[], k: 'amount' | 'ecl' | 'eclBase' | 'eclUp' | 'eclDown') => rows.reduce((a, r) => a + r[k], 0);\nfunction group(rows: Calc[], key: (r: Calc) => string, order?: string[]): Agg[] {\n    const m = new Map<string, Calc[]>(); rows.forEach(r => { const k = key(r); if (!m.has(k)) m.set(k, []); m.get(k)!.push(r); });\n    const keys = order ? [...order.filter(k => m.has(k)), ...[...m.keys()].filter(k => !order.includes(k))] : [...m.keys()];\n    return keys.map(k => { const a = m.get(k)!; return { key: k, n: a.length, gross: sum(a, 'amount'), ecl: sum(a, 'ecl'), rows: a }; });\n}\nconst deltaOf = (now: number, before: number | null | undefined, inverse = true, isPct = false) => {\n    if (before === null || before === undefined) return null; const d = now - before; if (Math.abs(d) < (isPct ? 0.0005 : 0.5)) return { txt: 'no change', bad: false };\n    const txt = (d > 0 ? '\u25b2 ' : '\u25bc ') + (isPct ? (Math.abs(d) * 100).toFixed(1) + ' pts' : before ? pct(Math.abs(d / before), 1) : fmt(Math.abs(d)));\n    return { txt, bad: inverse ? d > 0 : d < 0 };\n};\n\nexport function Dashboard({ res, s, inv, where, prior, onDlX, onDlC, copyText, onEdit, onApply }: {\n    res: Res; s: Settings; inv: Inv[]; where: string; prior: Prior | null; onDlX: () => void; onDlC: () => void; copyText: () => string; onEdit: () => void; onApply: (p: Partial<Settings>) => void;\n}) {\n    const [tab, setTab] = useState<TabKey>('overview');\n    const [f, setF] = useState<Filter>({ stage: null, bucket: null, seg: null });\n    const [cust, setCust] = useState<string | null>(null);\n    const [row, setRow] = useState<Calc | null>(null);\n    const [copy, setCopy] = useState<string | null>(null);\n    const toggle = (k: keyof Filter, v: string) => setF(p => ({ ...p, [k]: p[k] === v ? null : v }));\n    const rows = useMemo(() => res.rows.filter(r => (!f.stage || r.stageKey === f.stage) && (!f.bucket || r.bucket === f.bucket) && (!f.seg || r.seg === f.seg)), [res, f]);\n    const filtered = !!(f.stage || f.bucket || f.seg);\n    const bandOrder = [...s.buckets.map(b => b.label), 'Specific provision'];\n    const A = useMemo(() => { const econ = econEffect(inv, s, res.ecl); const slide = slideImpact(res, s); return { econ, slide, acts: actions(res, s, fmt, slide, econ) }; }, [res, s, inv]);\n\n    const g = sum(rows, 'amount'), e = sum(rows, 'ecl');\n    const overdue = sum(rows.filter(r => r.dpd > 0), 'amount'); const s23 = sum(rows.filter(r => r.stageKey !== 'Stage 1'), 'amount');\n    const byStage = group(rows, r => r.stageKey, STAGES); const byBand = group(rows, r => r.bucket, bandOrder); const bySeg = group(rows, r => r.seg).sort((a, b) => b.ecl - a.ecl);\n    const byCust = group(rows, r => r.customer).sort((a, b) => b.ecl - a.ecl);\n    const stageAll = group(res.rows.filter(r => (!f.bucket || r.bucket === f.bucket) && (!f.seg || r.seg === f.seg)), r => r.stageKey, STAGES);\n    const P = prior?.res; const unit = s.method === 'general' ? 'exposures' : 'invoices';\n\n    const tabs: { key: TabKey; label: string; badge?: string | number }[] = [\n        { key: 'overview', label: 'Overview' }, { key: 'stages', label: 'Stages 1-2-3' }, { key: 'ageing', label: 'Ageing & segments' }, { key: 'customers', label: 'Customers & ' + unit },\n        { key: 'scenarios', label: 'Economy & what-if' }, { key: 'movement', label: 'Movement' }, { key: 'accounting', label: 'Journal & disclosure' }, { key: 'method', label: 'How it is calculated' },\n    ];\n\n    return <div className=\"dash\">\n        {/* ---------- headline ---------- */}\n        <div className=\"hero\">\n            <div className=\"hero-l\">\n                <div className=\"hero-tags\"><span>As at {s.reportDate}<\/span><span>{s.method === 'simplified' ? 'Simplified approach (lifetime)' : 'General approach (3 stages)'}<\/span><span>{where}<\/span>{s.measure === 'fvoci' && <span>FVOCI<\/span>}<\/div>\n                <p className=\"hero-k\">Loss allowance to book<\/p>\n                <h2>{fmt(res.ecl)}<\/h2>\n                <p className=\"hero-p\">That is <b>{pct(res.coverage, 2)}<\/b> of the <b>{fmt(res.gross)}<\/b> owed across {res.rows.length} {unit}.{s.measure === 'ac' && <> Net carrying amount <b>{fmt(res.gross - res.ecl  ...f, seg: e.target.value || null })}><option value=\"\">All segments<\/option>{[...new Set(res.rows.map(r => r.seg))].sort().map(k => <option key={k}>{k}<\/option>)}<\/select>\n            {filtered ? <Btn small kind=\"ghost\" onClick={() => setF({ stage: null, bucket: null, seg: null })}>Clear filters<\/Btn> : <span className=\"mut fbar-h\">Tip: click any bar, slice or stage card to filter.<\/span>}\n        <\/div>}\n\n        {/* ---------- OVERVIEW ---------- */}\n        {tab === 'overview' && <>\n            <div className=\"kpis\">\n                <Kpi label=\"Expected credit loss\" value={fmt(e)} tone=\"#0f766e\" delta={!filtered ? deltaOf(e, P ? P.ecl : s.openingAllowance > 0 ? s.openingAllowance : null) : null} sub={filtered ? pct(res.ecl ? e / res.ecl : 0, 0) + ' of total' : 'no earlier period'} info=\"The loss allowance: the amount you expect not to collect, weighted over three economic scenarios (IFRS 9 5.5.17).\" />\n                <Kpi label=\"Gross amount owed\" value={fmt(g)} tone=\"#4f46e5\" delta={!filtered && P ? deltaOf(g, P.gross, false) : null} sub={rows.length + ' ' + unit} />\n                <Kpi label=\"Coverage\" value={pct(g ? e / g : 0, 2)} tone=\"#7c3aed\" delta={!filtered && P ? deltaOf(g ? e / g : 0, P.coverage, true, true) : null} sub=\"loss / owed\" info=\"Expected loss as a share of the gross amount. Compare it between periods and with peers.\" />\n                <Kpi label=\"Overdue\" value={pct(g ? overdue / g : 0, 0)} tone=\"#d97706\" sub={short(overdue) + ' past due'} />\n                <Kpi label=\"In Stage 2 or 3\" value={pct(g ? s23 / g : 0, 0)} tone=\"#e11d48\" sub={short(s23) + ' at higher risk'} info=\"Share of the amount where credit risk has increased significantly (Stage 2) or that is credit-impaired (Stage 3).\" onClick={() => setTab('stages')} />\n            <\/div>\n            <StageStrip groups={stageAll} total={sum(res.rows, 'amount')} s={s} selected={f.stage} onSelect={k => toggle('stage', k)} />\n            <div className=\"g2\">\n                <Card title=\"Where the expected loss sits\" sub=\"By age band (days past due). Click a bar to filter.\" info=\"Provision matrix by days past due (IFRS 9 B5.5.35). Older items carry higher rates.\">\n                    <Bars labels={byBand.map(b => b.key)} series={[{ name: 'Expected loss', values: byBand.map(b => b.ecl) }]} perBar={RISK} selected={f.bucket} onSelect={k => toggle('bucket', k)} fmtV={fmt}\n                        tipExtra={i => <div className=\"mut\">Owed {fmt(byBand[i].gross)} | coverage {pct(byBand[i].gross ? byBand[i].ecl / byBand[i].gross : 0, 1)}<\/div>} />\n                <\/Card>\n                <Card title=\"Amount owed by stage\" sub=\"Hover for detail, click to filter.\">\n                    <Donut parts={byStage.map(x => ({ label: x.key, value: x.gross, color: STAGE_COLOR[x.key] }))} center={short(g)} centerSub=\"owed\" selected={f.stage} onSelect={k => toggle('stage', k)} />\n                <\/Card>\n            <\/div>\n            <div className=\"g2\">\n                <Card title={`Top ${s.method === 'general' ? 'borrowers' : 'customers'} by expected loss`} sub=\"Click a name for every item and its calculation.\">\n                    <HBars items={byCust.slice(0, 7).map(c => ({ label: c.key, value: c.ecl, sub: `owes ${fmt(c.gross)} | ${pct(c.gross ? c.ecl / c.gross : 0, 1)} coverage` }))} onSelect={setCust} />\n                <\/Card>\n                <Card title=\"What to do next\" sub=\"Actions that lower the allowance or the risk.\">\n                    <ol className=\"acts\">{A.acts.slice(0, 5).map((a, i) => <li key={i}><div><b>{a.title}<\/b>{a.amount && <em>{a.amount}<\/em>}<\/div><span>{a.why}<\/span><\/li>)}<\/ol>\n                <\/Card>\n            <\/div>\n        <\/>}\n\n        {/* ---------- STAGES ---------- */}\n        {tab === 'stages' && <>\n            <StageStrip groups={stageAll} total={sum(res.rows, 'amount')} s={s} selected={f.stage} onSelect={k => toggle('stage', k)} />\n            <Card title=\"How items are put into stages\" sub={s.method === 'simplified' ? 'Simplified approach: every item already carries lifetime expected loss (5.5.15), so the stage does not change the amount. Stages are still needed for the IFRS 7 disclosure.' : 'General approach (5.5.3-5.5.5): the stage decides whether 12-month or lifetime expected loss is booked.'}>\n                <div className=\"rules\">\n                    <div style={{ ['--c' as any]: STAGE_COLOR['Stage 1'] }}><b>Stage 1<\/b><span>Up to {s.sicrDays} days past due and no other sign of increased risk.<\/span><em>{s.method === 'general' ? '12-month expected loss' : 'Lifetime (simplified)'}<\/em><\/div>\n                    <div style={{ ['--c' as any]: STAGE_COLOR['Stage 2'] }}><b>Stage 2<\/b><span>More than {s.sicrDays} days past due (5.5.11), or PD at least {s.sicrMult}x the PD at the start (5.5.9), or set to 2 in your file.<\/span><em>Lifetime expected loss<\/em><\/div>\n                    <div style={{ ['--c' as any]: STAGE_COLOR['Stage 3'] }}><b>Stage 3<\/b><span>More than {s.defaultDays} days past due (B5.5.37), flagged credit-impaired, or set to 3 in your file.<\/span><em>{s.method === 'general' ? 'Lifetime, PD 100%' : 'Lifetime; PD 100% if flagged'}<\/em><\/div>\n                    <div style={{ ['--c' as any]: STAGE_COLOR.POCI }}><b>POCI<\/b><span>Bought or lent when already credit-impaired (5.5.13).<\/span><em>Change in lifetime loss<\/em><\/div>\n                <\/div>\n            <\/Card>\n            <div className=\"g2\">\n                <Card title=\"Share of amount and of loss by stage\" sub=\"Most of the loss usually sits in a small share of the amount.\">\n                    <Stack100 colors={STAGE_COLOR} onSelect={k => toggle('stage', k)} rows={[{ label: 'Owed', parts: byStage.map(x => ({ key: x.key, value: x.gross })) }, { label: 'Expected loss', parts: byStage.map(x => ({ key: x.key, value: x.ecl })) }]} />\n                    <table className=\"tbl mt\"><thead><tr><th>Stage<\/th><th className=\"r\">Items<\/th><th className=\"r\">Owed<\/th><th className=\"r\">Expected loss<\/th><th className=\"r\">Coverage<\/th><\/tr><\/thead>\n                        <tbody>{byStage.map(x => <tr key={x.key} className=\"click\" onClick={() => toggle('stage', x.key)}><td><i className=\"dot\" style={{ background: STAGE_COLOR[x.key] }} />{x.key}<\/td><td className=\"r\">{x.n}<\/td><td className=\"r\">{fmt(x.gross)}<\/td><td className=\"r\">{fmt(x.ecl)}<\/td><td className=\"r\">{pct(x.gross ? x.ecl / x.gross : 0, 2)}<\/td><\/tr>)}\n                            <tr className=\"tot\"><td>Total<\/td><td className=\"r\">{rows.length}<\/td><td className=\"r\">{fmt(g)}<\/td><td className=\"r\">{fmt(e)}<\/td><td className=\"r\">{pct(g ? e / g : 0, 2)}<\/td><\/tr><\/tbody><\/table>\n                <\/Card>\n                <Card title=\"Why items are in each stage\" sub=\"The rule that placed each item, so the staging can be checked.\">\n                    <table className=\"tbl\"><thead><tr><th>Stage<\/th><th>Reason<\/th><th className=\"r\">Items<\/th><th className=\"r\">Owed<\/th><\/tr><\/thead>\n                        <tbody>{group(rows, r => r.stageKey + '|' + r.stageWhy).sort((a, b) => a.key.localeCompare(b.key)).map(x => { const [st, why] = x.key.split('|'); return <tr key={x.key}><td><i className=\"dot\" style={{ background: STAGE_COLOR[st] }} />{st}<\/td><td>{why}<\/td><td className=\"r\">{x.n}<\/td><td className=\"r\">{fmt(x.gross)}<\/td><\/tr>; })}<\/tbody><\/table>\n                <\/Card>\n            <\/div>\n            <Card title=\"Credit risk by age band and stage (IFRS 7.35M)\" sub=\"Gross amount and expected loss for each age band in each stage.\">\n                <div className=\"scroll\"><table className=\"tbl\"><thead><tr><th>Age band<\/th>{byStage.map(x => <th key={x.key} className=\"r\">{x.key} owed<\/th>)}{byStage.map(x => <th key={x.key + 'e'} className=\"r\">{x.key} loss<\/th>)}<\/tr><\/thead>\n                    <tbody>{byBand.map(b => <tr key={b.key}><td>{b.key}<\/td>{byStage.map(x => <td key={x.key} className=\"r\">{fmt(sum(b.rows.filter(r => r.stageKey === x.key), 'amount'))}<\/td>)}{byStage.map(x => <td key={x.key + 'e'} className=\"r\">{fmt(sum(b.rows.filter(r => r.stageKey === x.key), 'ecl'))}<\/td>)}<\/tr>)}<\/tbody><\/table><\/div>\n            <\/Card>\n        <\/>}\n\n        {/* ---------- AGEING & SEGMENTS ---------- */}\n        {tab === 'ageing' && <>\n            <Card title=\"Owed and expected loss by age band\" sub=\"Click a band to filter the whole dashboard.\">\n                <Bars labels={byBand.map(b => b.key)} series={[{ name: 'Owed', values: byBand.map(b => b.gross) }, { name: 'Expected loss', values: byBand.map(b => b.ecl) }]} colors={['#a5b4fc', '#e11d48']} selected={f.bucket} onSelect={k => toggle('bucket', k)} fmtV={fmt} />\n                <table className=\"tbl mt\"><thead><tr><th>Age band<\/th><th className=\"r\">Rate used<\/th><th className=\"r\">Items<\/th><th className=\"r\">Owed<\/th><th className=\"r\">Expected loss<\/th><th className=\"r\">Coverage<\/th><\/tr><\/thead>\n                    <tbody>{byBand.map(b => { const bk = s.buckets.find(x => x.label === b.key); return <tr key={b.key} className=\"click\" onClick={() => toggle('bucket', b.key)}><td>{b.key}<\/td><td className=\"r\">{bk ? pct(bk.pd, 1) : 'individual'}<\/td><td className=\"r\">{b.n}<\/td><td className=\"r\">{fmt(b.gross)}<\/td><td className=\"r\">{fmt(b.ecl)}<\/td><td className=\"r\">{pct(b.gross ? b.ecl / b.gross : 0, 1)}<\/td><\/tr>; })}<\/tbody><\/table>\n            <\/Card>\n            {bySeg.length > 1 && <Card title=\"Coverage heatmap: segment x age band\" sub=\"Darker = higher share expected to be lost. Click a cell to filter by both.\">\n                <Heatmap rows={bySeg.map(x => x.key)} cols={byBand.map(b => b.key)} cell={(sg, bd) => { const rs = rows.filter(r => r.seg === sg && r.bucket === bd); return { gross: sum(rs, 'amount'), ecl: sum(rs, 'ecl') }; }} onSelect={(sg, bd) => setF({ ...f, seg: sg, bucket: bd })} />\n            <\/Card>}\n            <div className=\"g2\">\n                <Card title=\"Expected loss by segment\" sub=\"Click to filter.\">\n                    <HBars items={bySeg.map(x => ({ label: x.key, value: x.ecl, sub: `owes ${fmt(x.gross)} | ${pct(x.gross ? x.ecl / x.gross : 0, 1)}` }))} onSelect={k => toggle('seg', k)} selected={f.seg} color={C.teal2} />\n                <\/Card>\n                <Card title=\"When the open items were issued\" sub=\"Old months still unpaid are a warning sign.\">\n                    {(() => { const co = cohorts(rows); return <Bars height={200} labels={co.map(c => c.key)} series={[{ name: 'Owed', values: co.map(c => c.owed) }, { name: 'Expected loss', values: co.map(c => c.ecl) }]} colors={['#a5b4fc', '#f59e0b']} fmtV={fmt} />; })()}\n                <\/Card>\n            <\/div>\n        <\/>}\n\n        {/* ---------- CUSTOMERS & ITEMS ---------- */}\n        {tab === 'customers' && <>\n            <Card title={s.method === 'general' ? 'Borrowers' : 'Customers'} sub=\"Click a row to see every item and how its loss was worked out.\">\n                <DataTable rows={byCust} onRow={c => setCust(c.key)} initialSort={{ key: 'ecl', dir: -1 }} cols={[\n                    { key: 'name', label: 'Name', get: c => c.key },\n                    { key: 'n', label: 'Items', get: c => c.n, num: true },\n                    { key: 'gross', label: 'Owed', get: c => c.gross, show: c => fmt(c.gross), num: true },\n                    { key: 'ecl', label: 'Expected loss', get: c => c.ecl, show: c => fmt(c.ecl), num: true },\n                    { key: 'cov', label: 'Coverage', get: c => c.gross ? c.ecl / c.gross : 0, show: c => pct(c.gross ? c.ecl / c.gross : 0, 1), num: true },\n                    { key: 'st', label: 'Worst stage', get: c => c.rows.reduce((a, r) => Math.max(a, r.poci ? 4 : r.stage), 0), show: c => { const w = c.rows.reduce((a, r) => (r.poci ? 4 : r.stage) > a.v ? { v: r.poci ? 4 : r.stage, k: r.stageKey } : a, { v: 0, k: '' }); return <span className=\"badge\" style={{ background: STAGE_COLOR[w.k] }}>{w.k}<\/span>; }, num: true },\n                ] as Col<Agg>[]} />\n            <\/Card>\n            <Card title={'Every ' + (unit === 'invoices' ? 'invoice' : 'exposure')} sub=\"Click a row for the step-by-step calculation.\">\n                <DataTable rows={rows} onRow={setRow} initialSort={{ key: 'ecl', dir: -1 }} cols={itemCols(s)} />\n            <\/Card>\n        <\/>}\n\n        {/* ---------- ECONOMY & WHAT-IF ---------- */}\n        {tab === 'scenarios' && <Scenarios res={res} s={s} inv={inv} where={where} econ={A.econ} onApply={onApply} />}\n\n        {/* ---------- MOVEMENT ---------- */}\n        {tab === 'movement' && <Movement res={res} s={s} prior={prior} onEdit={onEdit} />}\n\n        {/* ---------- ACCOUNTING ---------- */}\n        {tab === 'accounting' && <Accounting res={res} s={s} />}\n\n        {tab === 'method' && <Method res={res} s={s} where={where} />}\n\n        {/* ---------- drill-downs ---------- */}\n        {cust && (() => { const rs = res.rows.filter(r => r.customer === cust); const cg = sum(rs, 'amount'), ce = sum(rs, 'ecl');\n            return <Drawer title={cust} sub={`${rs.length} item${rs.length === 1 ? '' : 's'} | owes ${fmt(cg)} | expected loss ${fmt(ce)} (${pct(cg ? ce / cg : 0, 1)})`} onClose={() => setCust(null)}>\n                {rs.some(r => r.isSpec) && <Note title=\"Specific provision\">This customer is assessed individually: {s.specific[cust]?.note || 'no reason entered'}.<\/Note>}\n                <DataTable rows={rs} onRow={r => { setRow(r); }} search={false} pageSize={20} initialSort={{ key: 'ecl', dir: -1 }} cols={itemCols(s).filter(c => c.key !== 'cust')} />\n                <p className=\"mut\">Click an item for its calculation.<\/p>\n            <\/Drawer>; })()}\n        {row && <Drawer title={(row.invNo || 'Row ' + row.row) + ' - ' + row.customer} sub={`${row.stageKey} | ${row.bucket} | ${row.horizon}`} onClose={() => setRow(null)}><Trace r={row} s={s} res={res} /><\/Drawer>}\n        {copy !== null && <Drawer title=\"Copy the results into Excel\" sub=\"Use this if the download button is blocked in your browser.\" onClose={() => setCopy(null)}>\n            <textarea className=\"ta\" readOnly value={copy} onFocus={e => e.currentTarget.select()} />\n            <p className=\"mut\">Click inside the box, press Ctrl+A then Ctrl+C, and paste into cell A1 of a new Excel sheet.<\/p><\/Drawer>}\n    <\/div>;\n}\n\nfunction itemCols(s: Settings): Col<Calc>[] {\n    return [\n        { key: 'cust', label: s.method === 'general' ? 'Borrower' : 'Customer', get: r => r.customer },\n        { key: 'no', label: 'Reference', get: r => r.invNo || r.invDate },\n        { key: 'dpd', label: 'Days late', get: r => r.dpd, show: r => Math.max(0, r.dpd), num: true },\n        { key: 'amt', label: 'Owed', get: r => r.amount, show: r => fmt(r.amount), num: true },\n        { key: 'st', label: 'Stage', get: r => r.stageKey, show: r => <span className=\"badge\" style={{ background: STAGE_COLOR[r.stageKey] }}>{r.stageKey}<\/span> },\n        { key: 'pd', label: 'PD', get: r => r.pd, show: r => pct(r.pd, 2), num: true },\n        { key: 'ecl', label: 'Expected loss', get: r => r.ecl, show: r => fmt(r.ecl), num: true },\n    ];\n}\n\nfunction StageStrip({ groups, total, s, selected, onSelect }: { groups: Agg[]; total: number; s: Settings; selected: string | null; onSelect: (k: string) => void }) {\n    const show = STAGES.filter(k => k !== 'POCI' || groups.some(x => x.key === 'POCI'));\n    return <div className={'stages n' + show.length}>{show.map(k => { const x = groups.find(y => y.key === k) || { n: 0, gross: 0, ecl: 0 }; const t = STAGE_TEXT[k];\n        return <button type=\"button\" key={k} className={'stc' + (selected === k ? ' on' : '') + (selected && selected !== k ? ' dim' : '')} style={{ ['--c' as any]: STAGE_COLOR[k] }} onClick={() => onSelect(k)}>\n            <div className=\"stc-h\"><b>{k}<\/b><span>{t.title}<\/span><\/div>\n            <div className=\"stc-v\">{fmt(x.ecl)}<\/div>\n            <div className=\"stc-m\"><span>{x.n} item{x.n === 1 ? '' : 's'}<\/span><span>owed {short(x.gross)}<\/span><span>coverage {pct(x.gross ? x.ecl / x.gross : 0, 1)}<\/span><\/div>\n            <div className=\"stc-bar\"><i style={{ width: (total ? x.gross / total * 100 : 0) + '%' }} /><\/div>\n            <small>{s.method === 'simplified' && k !== 'POCI' ? 'Lifetime expected loss (simplified)' : t.horizon}<\/small>\n        <\/button>; })}<\/div>;\n}\n\nfunction Trace({ r, s, res }: { r: Calc; s: Settings; res: Res }) {\n    const w = res.scen; const band = s.buckets.find(b => b.label === r.bucket);\n    const steps: [string, React.ReactNode, string?][] = [\n        ['Amount owed', fmt(r.amount)],\n        ...(r.undrawn ? [['Undrawn commitment x CCF', fmt(r.undrawn) + ' x ' + pct(s.ccf, 0), 'B5.5.31'] as [string, string, string]] : []),\n        ...(r.collateral ? [['Less collateral / insurance', '(' + fmt(r.collateral) + ')', 'B5.5.55'] as [string, string, string]] : []),\n        ['Exposure at default', <b key=\"e\">{fmt(r.base)}<\/b>],\n        ['Days past due', `${Math.max(0, r.dpd)} days ${r.dpdIn !== null ? '(from your file)' : r.dueDate ? '(from due date)' : '(invoice date + ' + s.termsDays + ' days terms)'}`],\n        ['Stage', <span key=\"s\"><span className=\"badge\" style={{ background: STAGE_COLOR[r.stageKey] }}>{r.stageKey}<\/span> {r.stageWhy}<\/span>, '5.5.3-5.5.11'],\n        ['Horizon', r.horizon, s.method === 'general' ? '5.5.5 / B5.5.43' : '5.5.15'],\n        ['PD before economy', r.isSpec ? 'Individual assessment' : pct(r.pd, 2) + (r.pdIn !== null ? ' (your PD column' + (r.maturity ? ', 12-month' : '') + ')' : band ? ' (band \"' + band.label + '\")' : '')],\n        ['Share lost (LGD)', r.isSpec ? '-' : pct(r.lgdUsed, 0) + (r.lgdIn !== null ? ' (your file)' : s.rateType === 'loss' ? ' (inside loss rate)' : '')],\n        ['Normal economy', fmt(r.eclBase) + '  (weight ' + pct(w[0].w, 0) + ', risk x' + w[0].mult.toFixed(3) + ')'],\n        ['Better economy', fmt(r.eclUp) + '  (weight ' + pct(w[1].w, 0) + ', risk x' + w[1].mult.toFixed(3) + ')'],\n        ['Worse economy', fmt(r.eclDown) + '  (weight ' + pct(w[2].w, 0) + ', risk x' + w[2].mult.toFixed(3) + ')'],\n        ...(r.poci ? [['Less lifetime loss at initial recognition', '(' + fmt(r.pociInitial) + ')', '5.5.14'] as [string, string, string]] : []),\n    ];\n    return <div>\n        <div className=\"trace\">{steps.map(([k, v, ref], i) => <div key={i} className=\"tr-r\"><span>{k}{ref && <small className=\"ref\">{ref}<\/small>}<\/span><span>{v}<\/span><\/div>)}<\/div>\n        <div className=\"tr-tot\"><span>Expected credit loss (probability-weighted)<\/span><b>{fmt(r.ecl)}<\/b><\/div>\n        <p className=\"mut\">{r.isSpec ? 'Specific provision allocated from the amount you set for this customer.' : r.pd >= 1 ? 'Credit-impaired: exposure x 100% x LGD x discount' + (s.overlay ? ' x (1 + overlay)' : '') + '. The economy does not change a 100% PD.' : r.maturity\n            ? 'Term structure: the 12-month PD is spread over each year of the horizon, discounted at the EIR to the middle of each year (B5.5.44).'\n            : 'Each scenario: exposure x min(100%, PD x risk multiplier) x LGD x discount ' + Math.pow(1 + (r.eirIn ?? s.eir), -s.months / 12).toFixed(4) + (s.overlay ? ' x (1 + ' + pct(s.overlay, 0) + ' overlay)' : '') + '.'}<\/p>\n    <\/div>;\n}\n\nfunction Scenarios({ res, s, inv, where, econ, onApply }: { res: Res; s: Settings; inv: Inv[]; where: string; econ: { neutral: number; delta: number; pct: number }; onApply: (p: Partial<Settings>) => void }) {\n    const [wd, setWd] = useState(s.wDown / (s.wBase + s.wUp + s.wDown || 1));\n    const [stress, setStress] = useState(0); const [lgdAdj, setLgdAdj] = useState(0); const [ov, setOv] = useState(s.overlay);\n    const segs = useMemo(() => [...new Set(res.rows.map(r => r.seg))], [res]);\n    const what = useMemo(() => {\n        const rest = (s.wBase + s.wUp) || 1; const k = (1 - wd) / rest;\n        const p: Partial<Settings> = { wDown: wd, wBase: s.wBase * k, wUp: s.wUp * k, overlay: ov, lgd: Math.min(1, Math.max(0, s.lgd + lgdAdj)),\n            segMult: Object.fromEntries(segs.map(sg => [sg, (s.segMult[sg] ?? 1) * (1 + stress)])) };\n        return { p, res: calculate(inv, { ...s, ...p }) };\n    }, [wd, stress, lgdAdj, ov, s, inv, segs]);\n    const d = what.res.ecl - res.ecl; const changed = Math.abs(d) >= 0.5;\n    const reset = () => { setWd(s.wDown / (s.wBase + s.wUp + s.wDown || 1)); setStress(0); setLgdAdj(0); setOv(s.overlay); };\n    const names = ['Normal', 'Better', 'Worse'];\n    return <>\n        <div className=\"scen\">{[1, 0, 2].map(i => { const x = res.scen[i]; return <div key={i} className={'sc sc' + i}><small>{names[i]} economy<\/small><b>{fmt(x.ecl)}<\/b><span>weight {pct(x.w, 0)} | risk x{x.mult.toFixed(2)}<\/span><\/div>; })}\n            <div className=\"sc sc-w\"><small>Probability-weighted<\/small><b>{fmt(res.ecl)}<\/b><span>normal economy only: {fmt(econ.neutral)}<\/span><\/div><\/div>\n        <div className=\"g2\">\n            <Card title=\"What-if: test your assumptions\" sub=\"Move the sliders and see the effect at once. Nothing changes until you press Apply.\" info=\"Useful for sensitivity disclosures (IFRS 7.35G) and for management challenge of the assumptions.\">\n                <Slider label=\"Weight of the worse economy\" value={wd} min={0} max={1} step={0.05} onChange={setWd} show={pct(wd, 0)} />\n                <Slider label=\"Stress all default rates (PD)\" value={stress} min={-0.5} max={1} step={0.05} onChange={setStress} show={(stress >= 0 ? '+' : '') + pct(stress, 0)} />\n                {s.rateType === 'pd' && <Slider label=\"Change share lost (LGD)\" value={lgdAdj} min={-0.2} max={0.3} step={0.05} onChange={setLgdAdj} show={pct(Math.min(1, Math.max(0, s.lgd + lgdAdj)), 0)} />}\n                <Slider label=\"Management overlay\" value={ov} min={0} max={0.3} step={0.01} onChange={setOv} show={pct(ov, 0)} />\n                <div className={'wi ' + (d > 0.5 ? 'up' : d < -0.5 ? 'down' : '')}><div><small>Allowance with these changes<\/small><b>{fmt(what.res.ecl)}<\/b><\/div>\n                    <div><small>Change<\/small><b>{changed ? (d > 0 ? '+' : '-') + fmt(Math.abs(d)) + ' (' + pct(Math.abs(d) / (res.ecl || 1), 1) + ')' : 'none'}<\/b><\/div><\/div>\n                <div className=\"row\"><Btn disabled={!changed} onClick={() => onApply(what.p)}>Apply to my assumptions<\/Btn><Btn kind=\"ghost\" onClick={reset}>Reset<\/Btn><\/div>\n                {s.rateType === 'pd' && lgdAdj !== 0 && <p className=\"mut\">The LGD change does not affect rows that have their own LGD in your file.<\/p>}\n            <\/Card>\n            <Card title=\"Sensitivity: if one economy happened for sure\" sub=\"Expected loss with 100% weight on each scenario.\">\n                <Bars height={210} labels={['Better', 'Normal', 'Worse', 'Weighted']} perBar={['#10b981', '#6366f1', '#e11d48', '#0f766e']} series={[{ name: 'Expected loss', values: [res.scen[1].ecl, res.scen[0].ecl, res.scen[2].ecl, res.ecl] }]} fmtV={fmt} />\n                <p className=\"mut\">The economy {econ.delta >= 0 ? 'adds' : 'removes'} {fmt(Math.abs(econ.delta))} ({pct(Math.abs(econ.pct), 1)}) compared with a normal year.<\/p>\n            <\/Card>\n        <\/div>\n        <Card title={'Economic factors (' + where + ')'} sub=\"Edit them in step 3. World Bank figures are past actuals: enter your own forecasts for a reportable figure (IFRS 9 5.5.17).\">\n            <div className=\"scroll\"><table className=\"tbl\"><thead><tr><th>Factor<\/th><th className=\"r\">Normal range<\/th><th className=\"r\">Normal<\/th><th className=\"r\">Better<\/th><th className=\"r\">Worse<\/th><th className=\"r\">Strength<\/th><th>Source<\/th><\/tr><\/thead>\n                <tbody>{s.factors.map(x => <tr key={x.name}><td>{x.name}<\/td><td className=\"r\">{x.baseline}<\/td><td className=\"r\">{x.base}<\/td><td className=\"r\">{x.up}<\/td><td className=\"r\">{x.down}<\/td><td className=\"r\">{x.sens}<\/td><td className=\"mut\">{x.src || 'Manual default'}<\/td><\/tr>)}<\/tbody><\/table><\/div>\n        <\/Card>\n    <\/>;\n}\n\nfunction Movement({ res, s, prior, onEdit }: { res: Res; s: Settings; prior: Prior | null; onEdit: () => void }) {\n    if (!prior) return <Card title=\"Compare with last period\"><Note title=\"No earlier period added\">To see what changed (new items, items paid, items that got older, and the IFRS 7 reconciliation by stage), add last period's file in step 3. I will not invent a trend.<\/Note><Btn onClick={onEdit}>Add last period's file<\/Btn><\/Card>;\n    const P = prior.res; const rc = prior.recon;\n    const tot = (l: ReconLine) => STAGES.reduce((a, k) => a + l.v[k], 0);\n    const sk = rc ? STAGES.filter(k => rc.allowance.some(l => Math.abs(l.v[k]) >= 0.5) || rc.gross.some(l => Math.abs(l.v[k]) >= 0.5)) : [];\n    const T = ({ title, lines }: { title: string; lines: ReconLine[] }) => <div className=\"scroll\"><table className=\"tbl\"><thead><tr><th>{title}<\/th>{sk.map(k => <th key={k} className=\"r\">{k}<\/th>)}<th className=\"r\">Total<\/th><\/tr><\/thead>\n        <tbody>{lines.map((l, i) => <tr key={l.label} className={i === 0 || i === lines.length - 1 ? 'tot' : ''}><td>{l.label}<\/td>{sk.map(k => <td key={k} className=\"r\">{acct(l.v[k])}<\/td>)}<td className=\"r\">{acct(tot(l))}<\/td><\/tr>)}<\/tbody><\/table><\/div>;\n    return <>\n        <div className=\"kpis\">\n            <Kpi label={'Allowance at ' + prior.date} value={fmt(P.ecl)} tone=\"#64748b\" sub=\"recalculated, today's assumptions\" />\n            <Kpi label={'Allowance at ' + s.reportDate} value={fmt(res.ecl)} tone=\"#0f766e\" delta={deltaOf(res.ecl, P.ecl)} />\n            <Kpi label=\"Owed\" value={fmt(res.gross)} tone=\"#4f46e5\" delta={deltaOf(res.gross, P.gross, false)} />\n            <Kpi label=\"Coverage\" value={pct(res.coverage, 2)} tone=\"#7c3aed\" delta={deltaOf(res.coverage, P.coverage, true, true)} />\n        <\/div>\n        {rc ? <>\n            <Card title=\"Why the allowance moved\" sub={`From ${prior.date} to ${s.reportDate}. Red raises the allowance, green lowers it.`}>\n                <Waterfall steps={[{ label: 'Opening allowance', value: tot(rc.allowance[0]), total: true }, { label: 'New items', value: tot(rc.allowance[3]) }, { label: 'Paid, settled or written off', value: tot(rc.allowance[4]) }, { label: 'Remeasurement of open items', value: tot(rc.allowance[5]) }, { label: 'Closing allowance', value: tot(rc.allowance[6]), total: true }]} />\n            <\/Card>\n            <Card title=\"Reconciliation by stage (IFRS 7.35H and 35I)\" sub=\"Transfers are shown at the opening allowance of the item that moved. The rest of its change is in remeasurement.\">\n                <T title=\"Loss allowance\" lines={rc.allowance} /><T title=\"Gross carrying amount\" lines={rc.gross} />\n                {s.openingAllowance > 0 && Math.abs(s.openingAllowance - P.ecl) >= 1 && <Note tone=\"warn\" title=\"Booked opening allowance differs\">You booked {fmt(s.openingAllowance)}; last period's file recalculated today gives {fmt(P.ecl)}. The difference of {fmt(Math.abs(s.openingAllowance - P.ecl))} comes from changed assumptions, not from the receivables.<\/Note>}\n            <\/Card>\n        <\/> : <Card title=\"Movement by age band\"><Note tone=\"warn\">Most rows have no invoice number, so items cannot be matched one by one. Add an invoice number column for the full reconciliation.<\/Note>\n            <Bars labels={res.byBucket.map(b => b.key)} series={[{ name: prior.date, values: res.byBucket.map(b => P.byBucket.find(x => x.key === b.key)?.ecl || 0) }, { name: s.reportDate, values: res.byBucket.map(b => b.ecl) }]} colors={['#c4b5fd', '#14b8a6']} fmtV={fmt} /><\/Card>}\n    <\/>;\n}\n\nfunction Accounting({ res, s }: { res: Res; s: Settings }) {\n    const ac = s.measure === 'ac';\n    const je: [string, number | null, number | null][] = [\n        ...(res.charge >= 0 ? [['Impairment loss on financial assets (P&L)', res.charge, null], [ac ? 'Loss allowance (balance sheet)' : 'OCI - FVOCI reserve', null, res.charge]] as [string, number | null, number | null][]\n            : [[ac ? 'Loss allowance (balance sheet)' : 'OCI - FVOCI reserve', -res.charge, null], ['Reversal of impairment loss (P&L)', null, -res.charge]] as [string, number | null, number | null][]),\n        ...(s.writeOffs ? [['Loss allowance (write-off used)', s.writeOffs, null], ['Receivables / loans (gross)', null, s.writeOffs]] as [string, number | null, number | null][] : []),\n        ...(s.recoveries ? [['Cash / bank', s.recoveries, null], ['Impairment loss - recoveries (P&L)', null, s.recoveries]] as [string, number | null, number | null][] : []),\n    ];\n    return <>\n        <div className=\"g2\">\n            <Card title=\"Allowance movement\" sub=\"Opening + charge - write-offs = closing.\">\n                <table className=\"tbl\"><tbody>\n                    <tr><td>Opening loss allowance<\/td><td className=\"r\">{fmt(s.openingAllowance)}<\/td><\/tr>\n                    <tr><td>Charge to profit or loss<\/td><td className=\"r\">{acct(res.charge)}<\/td><\/tr>\n                    <tr><td>Amounts written off (allowance used)<\/td><td className=\"r\">{acct(-s.writeOffs)}<\/td><\/tr>\n                    <tr className=\"tot\"><td>Closing loss allowance<\/td><td className=\"r\">{fmt(res.ecl)}<\/td><\/tr>\n                    {s.recoveries > 0 && <tr><td>Recoveries credited to P&L<\/td><td className=\"r\">{acct(-s.recoveries)}<\/td><\/tr>}\n                    <tr className=\"tot\"><td>Net impairment loss in P&L<\/td><td className=\"r\">{acct(res.pl)}<\/td><\/tr><\/tbody><\/table>\n                {s.openingAllowance === 0 && <Note tone=\"warn\">Opening allowance is 0, so the whole allowance shows as this period's charge. Enter the real figure in step 3.<\/Note>}\n            <\/Card>\n            <Card title=\"Journal entries\" sub={ac ? 'Amortised cost' : 'Debt at FVOCI: the allowance sits in OCI (5.5.2)'}>\n                <table className=\"tbl\"><thead><tr><th>Account<\/th><th className=\"r\">Debit<\/th><th className=\"r\">Credit<\/th><\/tr><\/thead>\n                    <tbody>{je.map(([a, dr, cr], i) => <tr key={i}><td className={cr !== null ? 'ind' : ''}>{a}<\/td><td className=\"r\">{dr !== null ? fmt(dr) : ''}<\/td><td className=\"r\">{cr !== null ? fmt(cr) : ''}<\/td><\/tr>)}<\/tbody><\/table>\n            <\/Card>\n        <\/div>\n        <Card title=\"Presentation in the balance sheet\">\n            <table className=\"tbl\"><tbody>\n                <tr><td>Gross carrying amount<\/td><td className=\"r\">{fmt(res.gross)}<\/td><\/tr>\n                <tr><td>Less loss allowance on drawn amounts<\/td><td className=\"r\">{acct(-(res.ecl - res.undrawn.ecl))}<\/td><\/tr>\n                <tr className=\"tot\"><td>{ac ? 'Net carrying amount' : 'Carrying amount (fair value; allowance in OCI)'}<\/td><td className=\"r\">{ac ? fmt(res.gross - res.ecl + res.undrawn.ecl) : fmt(res.gross)}<\/td><\/tr>\n                {res.undrawn.ecl > 0 && <tr><td>Provision for undrawn commitments (liability, IFRS 7 B8E)<\/td><td className=\"r\">{fmt(res.undrawn.ecl)}<\/td><\/tr>}<\/tbody><\/table>\n        <\/Card>\n        <Card title=\"IFRS 7 disclosures this tool prepares\" sub=\"All are in the Excel report.\">\n            <ul className=\"chk\">\n                <li className=\"ok\">35H / 35I reconciliation of allowance and gross amount by stage <span className=\"mut\">(needs last period's file)<\/span><\/li>\n                <li className=\"ok\">35M credit risk exposure by grade (age band) and stage<\/li>\n                <li className=\"ok\">35G inputs, assumptions and techniques: assumptions sheet and calculation method<\/li>\n                <li className=\"ok\">35N provision matrix for simplified-approach receivables<\/li>\n                <li className=\"ok\">Concentration of credit risk by customer and segment (34(c))<\/li>\n                <li>35F credit risk management policies, write-off policy and modification disclosures: <span className=\"mut\">write these yourself<\/span><\/li>\n            <\/ul>\n        <\/Card>\n    <\/>;\n}\n", "ecl.ts": "export type Bucket = { label: string; from: number; to: number; pd: number };\nexport type Factor = { name: string; unit: string; baseline: number; base: number; up: number; down: number; sens: number; src?: string };\nexport type Settings = {\n  reportDate: string; termsDays: number; method: 'simplified' | 'general';\n  // 'pd'   = band rates are probabilities of default, multiplied by LGD\n  // 'loss' = band rates are historical loss rates (B5.5.35 / IE Example 12) that already include the loss given default\n  rateType: 'pd' | 'loss';\n  buckets: Bucket[]; lgd: number; eir: number; months: number;\n  sicrDays: number;      // 5.5.11 rebuttable presumption: credit risk has increased significantly when more than 30 days past due\n  defaultDays: number;   // B5.5.37 rebuttable presumption: default does not occur later than 90 days past due\n  sicrMult: number;      // 5.5.9 relative test: current PD / PD at initial recognition at or above this = significant increase\n  ccf: number;           // B5.5.31 expected drawdown share of undrawn loan commitments\n  measure: 'ac' | 'fvoci'; // 5.5.2: FVOCI debt allowance sits in OCI, not against the carrying amount\n  factors: Factor[]; wBase: number; wUp: number; wDown: number; overlay: number;\n  segBy: 'segment' | 'country' | 'none'; segMult: Record<string, number>;\n  openingAllowance: number; writeOffs: number; recoveries: number;\n  specific: Record<string, Specific>;\n};\nexport type Specific = { mode: 'pct' | 'amt'; value: number; note: string };\nexport type Inv = {\n  row: number; customer: string; invNo: string; invDate: string; dueDate: string; amount: number;\n  segment: string; country: string; currency: string; collateral: number; impaired: boolean;\n  // optional columns, mainly for loans and bank portfolios\n  dpdIn: number | null; maturity: string; stageIn: number; pdIn: number | null; origPd: number | null;\n  lgdIn: number | null; eirIn: number | null; undrawn: number; poci: boolean; pociInitial: number;\n};\nexport type Calc = Inv & {\n  dpd: number; bucket: string; stage: number; stageKey: string; seg: string; base: number; pd: number; mult: number;\n  lgdUsed: number; horizon: string; eclUndrawn: number; stageWhy: string;\n  eclBase: number; eclUp: number; eclDown: number; ecl: number; rate: number; isSpec?: boolean;\n};\n\nexport const blankInv = (p: Partial<Inv>): Inv => ({\n  row: 0, customer: '', invNo: '', invDate: '', dueDate: '', amount: 0, segment: '', country: '', currency: '', collateral: 0, impaired: false,\n  dpdIn: null, maturity: '', stageIn: 0, pdIn: null, origPd: null, lgdIn: null, eirIn: null, undrawn: 0, poci: false, pociInitial: 0, ...p,\n});\n\nexport const defaultBuckets = (): Bucket[] => [\n  { label: 'Current', from: -99999, to: 0, pd: 0.01 },\n  { label: '1-30 days', from: 1, to: 30, pd: 0.03 },\n  { label: '31-60 days', from: 31, to: 60, pd: 0.08 },\n  { label: '61-90 days', from: 61, to: 90, pd: 0.15 },\n  { label: '91-180 days', from: 91, to: 180, pd: 0.35 },\n  { label: '181-365 days', from: 181, to: 365, pd: 0.6 },\n  { label: 'Over 365 days', from: 366, to: 99999, pd: 0.9 },\n];\nexport const defaultFactors = (): Factor[] => [\n  { name: 'Real GDP growth', unit: '%', baseline: 3, base: 3, up: 4, down: 0.5, sens: -0.08 },\n  { name: 'Unemployment rate', unit: '%', baseline: 5, base: 5, up: 4.5, down: 7, sens: 0.06 },\n  { name: 'Inflation (CPI)', unit: '%', baseline: 2.5, base: 2.5, up: 2, down: 5, sens: 0.03 },\n  { name: 'Lending interest rate', unit: '%', baseline: 5, base: 5, up: 4, down: 6.5, sens: 0.04 },\n  { name: 'Oil price (Brent)', unit: 'USD', baseline: 80, base: 80, up: 95, down: 60, sens: -0.005 },\n];\nexport const defaultSettings = (reportDate: string): Settings => ({\n  reportDate, termsDays: 30, method: 'simplified', rateType: 'pd', buckets: defaultBuckets(), lgd: 0.45, eir: 0.05, months: 3,\n  sicrDays: 30, defaultDays: 90, sicrMult: 2, ccf: 1, measure: 'ac',\n  factors: defaultFactors(), wBase: 0.5, wUp: 0.2, wDown: 0.3, overlay: 0,\n  segBy: 'segment', segMult: {}, openingAllowance: 0, writeOffs: 0, recoveries: 0, specific: {},\n});\n\nconst DAY = 86400000;\nexport const parseISO = (s: string) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };\nexport const dpdOf = (due: string, report: string) => Math.round((parseISO(report) - parseISO(due)) / DAY);\nexport const addDays = (s: string, n: number) => new Date(parseISO(s) + n * DAY).toISOString().slice(0, 10);\n\nexport function scenarioRaw(f: Factor[], key: 'base' | 'up' | 'down') {\n  return Math.exp(f.reduce((a, k) => a + k.sens * (k[key] - k.baseline), 0));\n}\nexport function scenarioMult(f: Factor[], key: 'base' | 'up' | 'down') {\n  return Math.min(3, Math.max(0.5, scenarioRaw(f, key)));\n}\n// Band for a number of days past due. If the bands leave a gap, the next higher (riskier) band is used, which is the prudent choice.\nexport const bucketOf = (b: Bucket[], dpd: number) => {\n  const hit = b.find(k => dpd >= k.from && dpd <= k.to); if (hit) return hit;\n  if (b.length && dpd < Math.min(...b.map(k => k.from))) return b.reduce((a, k) => (k.from < a.from ? k : a), b[0]);\n  const above = b.filter(k => k.from > dpd).sort((x, y) => x.from - y.from)[0];\n  return above || b[b.length - 1];\n};\n\n// Lifetime / 12-month expected loss for an exposure with a contractual life (general approach, B5.5.43-B5.5.44).\n// pd12 is an annual probability of default, converted to a constant hazard; loss is discounted at the EIR to the middle of each year.\nexport function termLoss(pd12: number, lifeYears: number, horizonYears: number, eir: number) {\n  const h = Math.max(0, Math.min(lifeYears, horizonYears)); const p = Math.min(1, Math.max(0, pd12));\n  let surv = 1, t = 0, pv = 0;\n  while (t < h - 1e-9) {\n    const dt = Math.min(1, h - t); const marg = surv * (1 - Math.pow(1 - p, dt));\n    pv += marg * Math.pow(1 + eir, -(t + dt / 2)); surv -= marg; t += dt;\n  }\n  return { cumPd: 1 - surv, pvPd: pv };\n}\n\nexport function calculate(allRows: Inv[], s: Settings) {\n  const mB = scenarioMult(s.factors, 'base'), mU = scenarioMult(s.factors, 'up'), mD = scenarioMult(s.factors, 'down');\n  const wsum = s.wBase + s.wUp + s.wDown || 1;\n  const w = { b: s.wBase / wsum, u: s.wUp / wsum, d: s.wDown / wsum };\n  const df = Math.pow(1 + s.eir, -s.months / 12);\n  // invoices issued after the reporting date are not recognised at that date and are left out\n  const future = allRows.filter(r => r.invDate > s.reportDate);\n  const rows = allRows.filter(r => r.invDate <= s.reportDate);\n  const custTot = new Map<string, number>(); rows.forEach(r => custTot.set(r.customer, (custTot.get(r.customer) || 0) + r.amount));\n  const specOf = (r: Inv) => {\n    const sp = s.specific[r.customer]; if (!sp || !(sp.value > 0)) return null;\n    const tot = custTot.get(r.customer) || 0; const prov = sp.mode === 'pct' ? tot * Math.min(1, sp.value) : Math.min(sp.value, tot);\n    return tot > 0 ? prov * r.amount / tot : 0;\n  };\n  const out: Calc[] = rows.map(r => {\n    const due = r.dueDate || addDays(r.invDate, s.termsDays);\n    const dpd = r.dpdIn !== null ? Math.round(r.dpdIn) : dpdOf(due, s.reportDate);\n    const bk = bucketOf(s.buckets, dpd);\n    // ---- staging (5.5.3, 5.5.9-5.5.11, B5.5.37, Appendix A credit-impaired) ----\n    let stage: number; let stageWhy: string;\n    const pdRatioUp = r.pdIn !== null && r.origPd !== null && r.origPd > 0 && r.pdIn / r.origPd >= s.sicrMult;\n    if (r.stageIn >= 1 && r.stageIn <= 3) { stage = r.stageIn; stageWhy = 'Stage from your file (your own assessment)'; }\n    else if (r.impaired) { stage = 3; stageWhy = 'Flagged credit-impaired'; }\n    else if (dpd > s.defaultDays) { stage = 3; stageWhy = `More than ${s.defaultDays} days past due (default)`; }\n    else if (dpd > s.sicrDays) { stage = 2; stageWhy = `More than ${s.sicrDays} days past due`; }\n    else if (pdRatioUp) { stage = 2; stageWhy = `PD now is ${s.sicrMult}x or more the PD at initial recognition`; }\n    else { stage = 1; stageWhy = 'No significant increase in credit risk'; }\n    const stageKey = r.poci ? 'POCI' : 'Stage ' + stage;\n    const seg = s.segBy === 'none' ? 'All customers' : (s.segBy === 'country' ? r.country : r.segment) || 'Unspecified';\n    const sprov = specOf(r);\n    if (sprov !== null) {\n      return { ...r, dpd, bucket: 'Specific provision', stage, stageKey, stageWhy, seg: 'Specific provision', base: r.amount, pd: 1, mult: 1, lgdUsed: 1, horizon: 'Individual assessment', eclUndrawn: 0, eclBase: sprov, eclUp: sprov, eclDown: sprov, ecl: sprov, rate: r.amount > 0 ? sprov / r.amount : 0, isSpec: true } as Calc;\n    }\n    const sm = s.segMult[seg] ?? 1;\n    const ratePd = (r.pdIn !== null ? r.pdIn : bk.pd) * sm;\n    const lgd = r.lgdIn !== null ? r.lgdIn : s.rateType === 'loss' ? 1 : s.lgd;\n    const eir = r.eirIn !== null ? r.eirIn : s.eir;\n    const undrawnEad = Math.max(0, r.undrawn) * s.ccf;\n    const base = Math.max(r.amount + undrawnEad - r.collateral, 0);\n    // PD = 100% when the exposure is credit-impaired: flagged, set to Stage 3 in your file, or Stage 3 under the general approach.\n    // Under the simplified approach, invoices past the default line without a flag keep their provision-matrix band rate.\n    const defaulted = r.impaired || r.stageIn === 3 || (s.method === 'general' && stage === 3);\n    // remaining contractual life in years, only when a maturity date is given (loans)\n    const life = r.maturity ? Math.max(dpdOf(s.reportDate, r.maturity) / 365, s.months / 12, 1 / 12) : 0;\n    const lifetime = s.method === 'simplified' || stage >= 2 || r.poci;\n    const dfRow = Math.pow(1 + eir, -s.months / 12);\n    let horizon = '';\n    const one = (m: number) => {\n      let p: number, d: number;\n      if (defaulted) { p = 1; d = dfRow; horizon = 'Default (PD 100%)'; }\n      else if (r.maturity) {\n        const t = termLoss(ratePd * m, life, lifetime ? life : 1, eir); p = t.cumPd; d = t.cumPd > 0 ? t.pvPd / t.cumPd : 1;\n        horizon = lifetime ? `Lifetime (${life.toFixed(2)} yrs)` : `12 months${life < 1 ? ' (life is shorter: ' + life.toFixed(2) + ' yrs)' : ''}`;\n      } else {\n        // provision-matrix rate for a short-term receivable: its whole life is under 12 months, so 12-month ECL = lifetime ECL (5.5.5, Appendix A)\n        p = Math.min(1, ratePd * m); d = dfRow; horizon = lifetime ? 'Lifetime' : '12 months (= lifetime, life under 1 year)';\n      }\n      return base * p * lgd * d * (1 + s.overlay);\n    };\n    const eclBase = one(mB), eclUp = one(mU), eclDown = one(mD);\n    let ecl = w.b * eclBase + w.u * eclUp + w.d * eclDown;\n    let eb = eclBase, eu = eclUp, ed = eclDown;\n    // POCI (5.5.13-5.5.14): allowance = cumulative change in lifetime ECL since initial recognition (may be a gain)\n    if (r.poci) { ecl -= r.pociInitial; eb -= r.pociInitial; eu -= r.pociInitial; ed -= r.pociInitial; }\n    const eclUndrawn = base > 0 ? Math.max(0, ecl) * Math.min(undrawnEad, base) / base : 0;\n    return { ...r, dpd, bucket: bk.label, stage, stageKey, stageWhy, seg, base, pd: defaulted ? 1 : ratePd, mult: mB, lgdUsed: lgd, horizon, eclUndrawn, eclBase: eb, eclUp: eu, eclDown: ed, ecl, rate: r.amount > 0 ? ecl / r.amount : 0 };\n  });\n  const sum = (a: Calc[], k: 'amount' | 'ecl' | 'eclBase' | 'eclUp' | 'eclDown' | 'eclUndrawn' | 'undrawn') => a.reduce((x, y) => x + y[k], 0);\n  const groupOf = (src: Calc[], key: (c: Calc) => string, order: string[]) => {\n    const m = new Map<string, Calc[]>();\n    src.forEach(c => { const k = key(c); if (!m.has(k)) m.set(k, []); m.get(k)!.push(c); });\n    const keys = order.length ? order.filter(k => m.has(k)) : [...m.keys()].sort();\n    return keys.map(k => { const a = m.get(k)!; return { key: k, n: a.length, gross: sum(a, 'amount'), ecl: sum(a, 'ecl'), rows: a }; });\n  };\n  const colRows = out.filter(c => !c.isSpec);\n  const byBucket = groupOf(colRows, c => c.bucket, s.buckets.map(b => b.label));\n  const bySeg = groupOf(colRows, c => c.seg, []);\n  const byCust = groupOf(out, c => c.customer, []).sort((a, b) => b.ecl - a.ecl);\n  // IFRS 7.35H/35M: all exposures, including individually assessed ones, belong to a stage\n  const byStage = groupOf(out, c => c.stageKey, ['Stage 1', 'Stage 2', 'Stage 3', 'POCI']);\n  const specRows = out.filter(c => c.isSpec);\n  const clamped = (['base', 'up', 'down'] as const).filter(k => { const r = scenarioRaw(s.factors, k); return r < 0.5 || r > 3; });\n  const gross = sum(out, 'amount'), ecl = sum(out, 'ecl');\n  // movement in the allowance: opening + charge - amounts written off = closing\n  const charge = ecl - s.openingAllowance + s.writeOffs;\n  return {\n    rows: out, byBucket, bySeg, byCust, byStage, gross, ecl, coverage: gross ? ecl / gross : 0, clamped, future,\n    coll: { n: colRows.length, gross: sum(colRows, 'amount'), ecl: sum(colRows, 'ecl') },\n    spec: { n: specRows.length, gross: sum(specRows, 'amount'), ecl: sum(specRows, 'ecl'), rows: specRows },\n    undrawn: { amount: sum(out, 'undrawn'), ecl: sum(out, 'eclUndrawn') },\n    scen: [\n      { name: 'Base', w: w.b, mult: mB, ecl: sum(out, 'eclBase') },\n      { name: 'Upside', w: w.u, mult: mU, ecl: sum(out, 'eclUp') },\n      { name: 'Downside', w: w.d, mult: mD, ecl: sum(out, 'eclDown') },\n    ],\n    charge, pl: charge - s.recoveries, df,\n  };\n}\n\n// ---------- parsing ----------\nexport function parseCSV(text: string): string[][] {\n  text = text.replace(/^\ufeff/, '');\n  const first = text.split('\\n')[0] || '';\n  const delim = (first.matc scientific notation (1.5E-2)\n  if (/^[-+]?\\d*\\.?\\d+e[-+]?\\d+$/i.test(s)) { const n = Number(s); return isFinite(n) ? n : null; }\n  let neg = false; if (/^\\(.*\\)$/.test(s)) { neg = true; s = s.slice(1, -1); }\n  if (/-\\s*$/.test(s)) { neg = true; s = s.replace(/-\\s*$/, ''); }\n  s = s.replace(/[^0-9.,\\-]/g, ''); if (!s) return null;\n  if (s.includes('.') && s.includes(',')) {\n    // both separators: the one written last is the decimal mark (1,234.56 or 1.234,56)\n    s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\\./g, '').replace(',', '.') : s.replace(/,/g, '');\n  } else if (/,\\d{1,2}$/.test(s)) s = s.replace(',', '.'); else s = s.replace(/,/g, '');\n  const n = parseFloat(s); if (isNaN(n)) return null; return neg ? -Math.abs(n) : n;\n}\n\nexport type FieldKey = 'customer' | 'invDate' | 'amount' | 'invNo' | 'dueDate' | 'segment' | 'country' | 'currency' | 'collateral'\n  | 'dpd' | 'maturity' | 'stage' | 'pd' | 'origPd' | 'lgd' | 'eir' | 'undrawn' | 'poci' | 'pociInitial' | 'impaired';\nexport const FIELDS: { key: FieldKey; label: string; required: boolean; hint: string; syn: string[]; adv?: boolean }[] = [\n  { key: 'customer', label: 'Customer name', required: true, hint: 'Who owes the money', syn: ['customer', 'client', 'debtor', 'borrower', 'party', 'name', 'account name', 'buyer'] },\n  { key: 'invDate', label: 'Invoice date', required: true, hint: 'Date the invoice was issued (for loans: date drawn)', syn: ['invoice date', 'inv date', 'date', 'doc date', 'issue date', 'posting date', 'origination date', 'disbursement date'] },\n  { key: 'amount', label: 'Outstanding amount', required: true, hint: 'Amount still unpaid (gross carrying amount)', syn: ['outstanding', 'balance', 'amount', 'open amount', 'receivable', 'gross carrying amount', 'total', 'due amount'] },\n  { key: 'invNo', label: 'Invoice number', required: false, hint: 'Optional. Needed to compare with last period invoice by invoice', syn: ['invoice no', 'invoice number', 'inv  continue; const i = h.findIndex((x, j) => !used.has(j) && x.includes(s)); if (i >= 0) { res[f.key] = i; used.add(i); break; } }\n  });\n  return res;\n}\nconst yes = (v: string) => /^(y|yes|true|1|default|defaulted|impaired|credit.?impaired|disputed|poci)$/i.test(v.trim());\nexport function buildInvoices(data: string[][], map: Record<FieldKey, number>, dayFirst: boolean) {\n  const rows: Inv[] = []; const issues: { row: number; why: string }[] = [];\n  const get = (r: string[], k: FieldKey) => (map[k] !== undefined && map[k] >= 0 ? (r[map[k]] ?? '').toString().trim() : '');\n  // rate columns: if any value is above 1 or has a % sign, the whole column is read as percentages (2.5 = 2.5%)\n  const pctCol = (k: FieldKey) => data.some(r => { const v = get(r, k); const n = toNum(v); return /%/.test(v) || (n !== null && Math.abs(n) > 1); });\n  const pc = { pd: pctCol('pd'), origPd: pctCol('origPd'), lgd: pctCol('lgd'), eir: pctCol('eir') };\n  const rate = (r: string[], k: 'pd' | 'origPd' | 'lgd' | 'eir') => { const n = toNum(get(r, k)); if (n === null) return null; const x = pc[k] ? n / 100 : n; return k === 'eir' ? x : Math.min(1, Math.max(0, x)); };\n  data.forEach((r, i) => {\n    const row = i + 2;\n    const amount = toNum(get(r, 'amount')); const invDate = toISODate(get(r, 'invDate'), dayFirst); const customer = get(r, 'customer');\n    if (!customer) return issues.push({ row, why: 'No customer name' });\n    if (amount === null) return issues.push({ row, why: 'Amount is empty or not a number' });\n    if (!invDate) return issues.push({ row, why: 'Invoice date is empty or not readable' });\n    const dd = get(r, 'dueDate'); const due = dd ? toISODate(dd, dayFirst) : '';\n    if (dd && !due) return issues.push({ row, why: 'Due date not readable' });\n    const md = get(r, 'maturity'); const mat = md ? toISODate(md, dayFirst) : '';\n    if (md && !mat) return issues.push({ row, why: 'Maturity date not readable' });\n    const st = /([123])/.exec(get(r, 'stage'));\n
